<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Clicker Game</h1>
        <div id="score-container">
            <p>Score: <span id="score">0</span></p>
        </div>
        <button id="clicker-btn">Click me!</button>

        <div id="upgrades-container">
            <h2>Upgrades</h2>
            <div id="upgrade1">
                <p>Upgrade 1 (Cost: <span id="upgrade1-cost">1</span> points)</p>
                <button id="buy-upgrade1">Buy Upgrade 1</button>
            </div>
            <div id="upgrade2">
                <p>Upgrade 2 (Cost: <span id="upgrade2-cost">100</span> points)</p>
                <button id="buy-upgrade2">Buy Upgrade 2</button>
            </div>
            <div id="upgrade3">
                <p>Upgrade 3 (Cost: <span id="upgrade3-cost">10000</span> points)</p>
                <button id="buy-upgrade3">Buy Upgrade 3</button>
            </div>
            <div id="upgrade4">
                <p>Upgrade 4 (Cost: <span id="upgrade4-cost">1000000</span> points)</p>
                <button id="buy-upgrade4">Buy Upgrade 4</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
